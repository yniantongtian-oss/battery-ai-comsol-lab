name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test stack
        run: python -m pip install -e ".[dev,pybamm]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Repository checks
        run: python scripts/check_repository.py
      - name: CLI validation
        run: |
          battery-lab validate-configs configs
          battery-lab validate-configs specs
      - name: Tests
        run: pytest --cov=battery_lab --cov-report=term-missing --cov-fail-under=90
      - name: Short real PyBaMM solve
        run: >-
          battery-lab simulate
          --config configs/lfp_graphite_baseline.yaml
          --out runs/ci-lfp-smoke
      - name: Cross-baseline and sweep runtime smoke
        if: matrix.python-version == '3.12'
        run: python scripts/smoke_runtime.py
