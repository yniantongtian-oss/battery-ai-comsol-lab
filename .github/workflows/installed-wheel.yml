name: Installed wheel acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installed-wheel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build --outdir wheel-dist
          python -m twine check --strict wheel-dist/*
      - name: Install outside the checkout and test public imports and CLI
        run: python .github/quality/wheel_smoke.py
