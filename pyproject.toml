[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-ai-comsol-lab"
version = "0.2.0"
description = "Reproducible battery electrochemistry, COMSOL multiphysics, AI/ML, BMS and digital-twin research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Battery AI + COMSOL Lab Contributors"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.10",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.9"]
pybamm = ["pybamm>=26.10.1"]
comsol = ["MPh>=1.4"]
ml = ["scikit-learn>=1.6", "scipy>=1.11.4,!=1.18.0"]
all = [
  "pybamm>=26.10.1",
  "MPh>=1.4",
  "scikit-learn>=1.6",
  "scipy>=1.11.4,!=1.18.0",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[project.scripts]
battery-lab = "battery_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
omit = ["src/battery_lab/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
