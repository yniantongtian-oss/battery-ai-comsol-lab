[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-ai-comsol-lab"
version = "0.1.0"
description = "Reproducible battery electrochemistry, COMSOL multiphysics, AI/ML, BMS and digital-twin research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Battery AI + COMSOL Lab Contributors"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]
pybamm = ["pybamm>=26.0"]
comsol = ["MPh>=1.2"]
ml = ["scikit-learn>=1.5", "scipy>=1.11"]
all = ["pybamm>=26.0", "MPh>=1.2", "scikit-learn>=1.5", "scipy>=1.11", "pytest>=8.2", "ruff>=0.6"]

[project.scripts]
battery-lab = "battery_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
